- link:
    ~/.config/:
      glob: true
      path: dot_config/*
      exclude: [dot_config/vesktop, dotconfig/atuin]

    ~/.icons/:
      path: dot_icons/*
      glob: true
      create: true

    ~/.local/share/icons/:
      path: dot_local/
      create: true

    ~/.local/share/rhythmbox/playlists.xmsl:
      path: dot_local/share/rhythmbox/playlists.xml
      create: true

    ~/.gtkrc-2.0:
    ~/.gitconfig:

    # We only want the setting-files, not caches etc.
    ~/.config/vesktop:
      path: dot_config/vesktop/*
      glob: true
      create: true

    # The atuin config keeps respawning prob bc of the service
    ~/.config/atuin:
      path: dot_config/atuin
      force: true

- create:
    - ~/dev/playground
