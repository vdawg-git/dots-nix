- link:
    ~/.config/:
      glob: true
      path: dot_config/*
      exclude: [dot_config/vesktop, dot_config/gtk*]

    ~/.icons/default:
      path: dot_icons/default
      create: true

    ~/.local/share/rhythmbox/playlists.xmsl:
      path: dot_local/share/rhythmbox/playlists.xml
      create: true

    ~/.gtkrc-2.0:
    ~/.gitconfig:

    # We only want the setting-files, not caches etc.
    ~/.config/vesktop:
      path: dot_config/vesktop/*
      glob: true
      create: true

    ~/.config/gtk-3.0:
      path: dot_config/gtk-3.0/*
      glob: true
      create: true
    ~/.config/gtk-4.0:
      path: dot_config/gtk-4.0/*
      glob: true
      create: true

- create:
    - ~/dev/playground
