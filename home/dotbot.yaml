- link:
    ~/.config/:
      glob: true
      path: dot_config/*
      exclude: [dot_config/vesktop, dot_config/gtk*, dot_config/puddletag]

    ~/.icons/default:
      path: dot_icons/default
      create: true

    ~/.local/share/rhythmbox/playlists.xml:
      path: dot_local/share/rhythmbox/playlists.xml
      create: true

    ~/.agents:
      path: dot_agents

    ~/:
      path: dot/.*
      glob: true
      create: true

    ~/Documents/obsidian/.obsidian/:
      path: dot_obsidian
      create: true

    ~/.local/share/icons/bibata-modern-classic:
      path: dot_local/share/icons/bibata-modern-classic
      create: true

    # Here we link some files not dirs (notice the glob property for that)

    # We only want the setting-files, not caches etc.
    ~/.config/vesktop:
      path: dot_config/vesktop/*
      glob: true
      create: true

    ~/.config/gtk-3.0:
      path: dot_config/gtk-3.0/*
      glob: true
      create: true
    ~/.config/gtk-4.0:
      path: dot_config/gtk-4.0/*
      glob: true
      create: true

    ~/.config/puddletag:
      path: dot_config/puddletag/*
      glob: true
      create: true

    ~/Pictures/Wallpapers:
      path: ../assets/wallpaper
      glob: true
      create: true
      


- create:
    - ~/Documents/obsidian
    - ~/Documents/sync
    - ~/Pictures/memes
    - ~/dev/playground
    - ~/z_bearbeiten
    - ~/.local/share/Anki2

- shell:
    # Quickshell fills this file with system dependent info
    - touch ./dot_config/quickshell/.qmlls.ini
    - ./import-activitywatch-categories.sh
