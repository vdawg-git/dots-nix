source=~/.config/hypr/variables.conf


$font_family = Monaspace Argon
$font_family_clock = Monaspace Argon Medium


# Gruvbox Material colors, used by Hyprlock currently

$fg0 = rgb(ddc7a1)
$fg = rgb(d4be98)
$fg1 = rgb(c5b18d)
$red = rgb(ea6962)
$orange = rgb(e78a4e)
$yellow = rgb(d8a657)
$green = rgb(a9b665)
$aqua = rgb(89b482)
$blue = rgb(7daea3)
$purple = rgb(d3869b)
$dimRed = rgb(b85651)
$dimOrange = rgb(bd6f3e)
$dimYellow = rgb(c18f41)
$dimGreen = rgb(8f9a52)
$dimAqua = rgb(72966c)
$dimBlue = rgb(68948a)
$dimPurple = rgb(ab6c7d)
$bg0 = rgb(101010)
$bg1 = rgb(1c1c1c)
$bg = rgb(292828)
$bg2 = rgb(32302f)
$bg3 = rgb(383432)
$bg4 = rgb(3c3836)
$bg5 = rgb(45403d)
$bg6 = rgb(504945)
$bg7 = rgb(5a524c)
$bg8 = rgb(665c54)
$bg9 = rgb(7c6f64)
$grey0 = rgb(7c6f64)
$grey1 = rgb(928374)
$grey2 = rgb(a89984)




general {
	# grace =  1000
	ignore_empty_input = true
	fractional_scaling = 2
	hide_cursor = true
	immediate_render = false
}

animation {
	bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92 
    bezier = hyprnostretch, 0.05, 0.9, 0.1, 1.0
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07
    bezier = easeInOutCirc, 0.85, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = softAcDecel, 0.26, 0.26, 0.15, 1
    bezier = md2, 0.4, 0, 0.2, 1 # use with .2s duration

    # Animation configs
    # animation = fadeIn, 1, 8, linear  
    animation = fadeOut, 1, 5, md3_decel, popin 60%
    animation = inputFieldColors, 1, 2, md3_accel, popin 60%
    animation = inputFieldFade, 0, 2, default
    animation = inputFieldWidth, 1, 3, md3_decel
    animation = inputFieldDots, 1, 4, md3_decel
}


background {
    path = $HOME/dotfiles/assets/wallpaper/bg.png
    # path = screenshot
	color = rgba(0,0,0,0)
    blur_passes = 0
    # blur_size   = 8
    # contrast = 2.6
    # vibrancy = 300
    # vibrancy_darkness = 0.0
	# brightness = 0.65
	# noise = 0.14
}

# shape {
#   size = 100%, 100%
#   onclick = "kitty"
#   color = rgba(0,0,255,0.5)
# }

input-field {
    monitor =
    size = 460, 90
    dots_size = 0.4
    dots_spacing = 0.43
    outer_color = rgba(0,0,0,0)
	inner_color = rgba(0,0,0,0)
    font_color = $dimOrange
    # fade_on_empty = true
	# outline_thickness = 3
    # dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.65 # Scale of dots' absolute size, 0.0 - 1.0
    # dots_center = false
    dots_rounding = 2 # -1 default circle, -2 follow input-field rounding
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = Your pw... # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = 4 # -1 means complete rounding (circle/oval)
    check_color = rgba(0,0,0,0)
    fail_color = $red # if authentication failed, changes outer_color and fail message color
    # fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    fail_transition = 140 # transition time in ms between normal outer_color and fail_color
    capslock_color = $yellow
    # numlock_color = $yellow
    # bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    # invert_numlock = false # change color if numlock is off
    swap_font_color = false 

    position = 0, -64
    halign = center
    valign = center

}

label { # Clock
    monitor =
    text = $TIME
    color = rgba(200, 100, 0, 0.1)
    font_size = 160
    font_family = $font_family_clock

    position = 0, 100
    halign = center
    valign = center


    shadow_passes = 1
    shadow_size = 5
	shadow_color = $red
	shadow_boost = 5.9
}

label { # Greeting
    monitor =
    # text = Greetings $USER
	text = cmd[update:0] ~/.config/hypr/scripts/lock-greet.sh
	# text = cmd[update:1000] echo "<span foreground='##ff2222'>$(date)</span>"
	text_align = center
    shadow_passes = 1
    shadow_boost = 0.5
    color = rgb(FCBE11)
    font_size = 24
    font_family = $font_family

    position = 0, 120
    halign = center
    valign = bottom

    shadow_passes = 1
    shadow_size = 5
	shadow_color = $red
	shadow_boost = 0.5
}

