source=./variables.conf

# A really cool app to use the cursor to click on the monitor.
# Like Neovims Leap/Flash for the desktop

bind=$mainMod, a,exec, wl-kbptr -o modes=floating,click -o mode_floating.source=detect
bind=$mainMod SHIFT, a,exec, wl-kbptr -o modes=tile,click

layerrule {
	name = wl-kbptr
	match:namespace = selection
	no_anim = on
}




