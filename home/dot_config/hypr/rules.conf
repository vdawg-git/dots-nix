# Privacy
windowrule {
  name = OnePassword
  no_screen_share = on
  match:class = ^(1password)$
}
windowrule {
  name = OnePassword-popup
  match:class = ^(1password)$
  match:float = true
  center = on
  pin = on
  stay_focused = on
  no_screen_share = on
}

windowrule {
  name = windowrule-38
  no_screen_share = on
  match:title = ^(vesktop)$
}
windowrule {
  name = windowrule-38
  no_screen_share = on
  match:title = ^(swayosd|qbittorrent)$
}

windowrule {
  name = windowrule-39
  no_screen_share = on
  pin = on
  stay_focused = on
  match:class = ^gcr-prompter$
}




# No animation
layerrule {
  name = layerrule-1
  no_anim = on
  blur = on
  ignore_alpha = 0.4
  match:namespace = walker
}


# Extras
layerrule {
  name = layerrule-2
  animation = slide right
  blur = on
  ignore_alpha = 0.1
  match:namespace = swaync-control-center
}

layerrule {
  name = layerrule-3
  animation = gnomed 88
  match:namespace = swww-daemon # background pop-in
}


